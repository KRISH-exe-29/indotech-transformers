name: Keep Render awake

# Render's free plan sleeps the backend after 15 idle minutes, and waking it takes 30-60 s,
# which makes the first form submit or login look broken. A ping every 10 minutes keeps it up.
# One always-on service fits inside Render's 750 free instance hours a month.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 120 --retry 2 https://indotech-transformers.onrender.com/api/auth/check
